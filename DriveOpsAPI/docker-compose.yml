services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: driveops_api
      MYSQL_USER: driveops_api
      MYSQL_PASSWORD: ${DRIVEOPS_API_DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./keycloak/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - driveops-net

  adminer:
    image: adminer:4.17.1
    container_name: adminer
    ports:
      - "8089:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
      - ADMINER_DESIGN=galkaev
    networks:
      - driveops-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    env_file:
      - .env
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - driveops-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - driveops-net

  api:
    build:
      context: ..
      dockerfile: DriveOpsAPI/DriveOps/Dockerfile
    container_name: driveops-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=driveops_api;User=driveops_api;Password=${DRIVEOPS_API_DB_PASSWORD};
      Keycloak__Authority: http://keycloak:8080/realms/driveops-dev
      Keycloak__AdminBaseUrl: http://keycloak:8080
      Keycloak__AdminClientSecret: ${DRIVEOPS_BACKEND_CLIENT_SECRET}
      Keycloak__ValidIssuers__0: http://localhost:8081/realms/driveops-dev
      Keycloak__ValidIssuers__1: http://keycloak:8080/realms/driveops-dev
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "5032:8080"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - driveops-net

  realtime:
    build:
      context: ..
      dockerfile: DriveOpsRealtime/DriveOpsRealtime/Dockerfile
    container_name: driveops-realtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=driveops_realtime;User=driveops_realtime;Password=${DRIVEOPS_REALTIME_DB_PASSWORD};
      Keycloak__Authority: http://keycloak:8080/realms/driveops-dev
      Keycloak__ValidIssuers__0: http://localhost:8081/realms/driveops-dev
      Keycloak__ValidIssuers__1: http://keycloak:8080/realms/driveops-dev
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5033:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - driveops-net

volumes:
  mysql_data:

networks:
  driveops-net: